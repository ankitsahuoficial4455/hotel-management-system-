<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact Us - Luxury Hotel</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<header>

    <h1>Luxury Hotel</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="rooms.html">Rooms</a>

        <a href="booking.html">Booking</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<main>

<section class="contact-section">

    <h2>Contact Us</h2>

    <p>
        Have a question or need help?
        Contact our hotel team.
    </p>


    <div class="contact-info">

        <h3>📍 Address</h3>

        <p>
            Luxury Hotel, Main Road,
            Bhopal, Madhya Pradesh, India
        </p>


        <h3>📞 Phone</h3>

        <p>
            +91 98765 43210
        </p>


        <h3>📧 Email</h3>

        <p>
            info@luxuryhotel.com
        </p>

    </div>


    <h2>Send Us a Message</h2>


    <form id="contactForm">

        <label>
            Your Name
        </label>

        <input
            type="text"
            placeholder="Enter your name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Message
        </label>

        <textarea
            rows="6"
            placeholder="Write your message..."
            required>
        </textarea>


        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</main>


<footer>

    <p>
        © 2026 Luxury Hotel.
        All Rights Reserved.
    </p>

</footer>
<script src="script.js"></script>
</body>

</html>
