<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Room | Luxury Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Luxury Hotel</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

<section class="booking-section">

    <h2>Book Your Room</h2>
    <p>Fill in your details and request your reservation.</p>

    <form id="bookingForm">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>

        <label>Select Room</label>
        <select name="room" required>
            <option value="">Select a room</option>
            <option>Single Room - ₹2,000 / Night</option>
            <option>Double Room - ₹3,500 / Night</option>
            <option>Deluxe Room - ₹5,000 / Night</option>
        </select>

        <label>Check-in Date</label>
        <input type="date" name="checkin" required>

        <label>Check-out Date</label>
        <input type="date" name="checkout" required>

        <label>Number of Guests</label>
        <input type="number" name="guests" min="1" max="10"
               placeholder="Number of guests" required>

        <button type="submit">Confirm Booking</button>

    </form>

</section>

</main>

<footer>
    <p>© 2026 Luxury Hotel. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
